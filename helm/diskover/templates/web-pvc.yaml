apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "diskover.fullname" . }}-web-data
  labels:
    {{- include "diskover.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.web.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.web.persistence.size }}
