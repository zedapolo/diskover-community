nameOverride: ""
fullnameOverride: ""

# Secrets d'authentification pour registres privés (ex: Harbor, Nexus, Quay)
# Laisser vide ([]) si les credentials de registre sont déjà configurés dans OpenShift
# (ex: pull secret global du cluster openshift-config/pull-secret ou lié aux ServiceAccounts).
imagePullSecrets: []
# - name: regcred

# ---------------------------------------------------------------------------
# Images de base Red Hat UBI 9 (utilisées par les BuildConfig si build.enabled=true)
# En environnement déconnecté avec build in-cluster : remplacer par votre miroir.
# ---------------------------------------------------------------------------
images:
  pythonBase: registry.access.redhat.com/ubi9/python-312:latest   # scanner
  nginxBase: registry.access.redhat.com/ubi9/nginx-126:latest     # diskover-web (+ php-fpm installé au build)

# ---------------------------------------------------------------------------
# Build des images dans OpenShift (BuildConfig + ImageStream)
# En environnement offline : passer enabled à false et renseigner web.image.repository
# et scanner.image.repository pour utiliser vos images pré-construites (ex: via Podman).
# ---------------------------------------------------------------------------
build:
  enabled: true
  git:
    uri: https://github.com/diskoverdata/diskover-community.git
    ref: v2.3.5
  pullSecret: ""          # Secret Kubernetes pour pull les images de base sur un registre privé
  pipIndexUrl: ""         # Miroir PyPI interne (ex: https://nexus.corp.local/repository/pypi/simple)
  pipExtraArgs: ""        # Arguments pip additionnels (ex: "--trusted-host nexus.corp.local")

# ---------------------------------------------------------------------------
# Elasticsearch (opérateur ECK - API elasticsearch.k8s.elastic.co/v1)
# ---------------------------------------------------------------------------
elasticsearch:
  create: true            # false => utiliser un cluster ES existant (host/userSecret ci-dessous)
  name: diskover          # nom du CR Elasticsearch => service <name>-es-http, secret <name>-es-elastic-user
  version: 8.19.0         # Diskover CE requiert Elasticsearch 8.x
  image: ""               # Image miroir (ex: registry.corp.local/elastic/elasticsearch:8.19.0). Indispensable en offline si create=true
  count: 1
  tls: true               # TLS sur la couche HTTP (certificat auto-signé ECK)
  sslVerification: false  # Diskover ne permet pas de fournir un CA => vérification désactivée
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 4Gi }   # le heap JVM est dimensionné automatiquement à 50 % de la limite
  storage:
    size: 50Gi
    storageClassName: ""
  # --- utilisés uniquement si create=false ---
  host: ""                # ex: mon-es-es-http.elastic.svc
  port: 9200
  user: elastic
  userSecret:
    name: ""              # secret contenant le mot de passe
    key: elastic

# ---------------------------------------------------------------------------
# diskover-web (nginx + php-fpm dans le même pod)
# ---------------------------------------------------------------------------
web:
  # Image pré-construite (recommandé en environnement offline)
  image:
    repository: ""        # Ex: registry.corp.local/diskover/diskover-web (obligatoire si build.enabled=false)
    tag: ""               # Par défaut appVersion du Chart (2.3.5)
    pullPolicy: IfNotPresent
  resources:
    nginx:   { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
    phpfpm:  { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  persistence:           # base SQLite (comptes, config UI) -> doit survivre aux redémarrages
    size: 1Gi
    storageClassName: ""
  route:
    enabled: true
    host: ""             # vide = host généré par OpenShift
    tls: true

# ---------------------------------------------------------------------------
# Scanner (CronJob)
# ---------------------------------------------------------------------------
scanner:
  # Image pré-construite (recommandé en environnement offline)
  image:
    repository: ""        # Ex: registry.corp.local/diskover/diskover-scanner (obligatoire si build.enabled=false)
    tag: ""               # Par défaut appVersion du Chart (2.3.5)
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 2Gi }
  supplementalGroups: []   # GID(s) nécessaires pour lire vos partages (NFS/SMB)
  extraArgs: ""            # arguments additionnels de diskover.py (ex: "--threads 8")

# ---------------------------------------------------------------------------
# Mappage des identités (utilisateurs / groupes SSSD, Active Directory, LDAP)
# Permet à Diskover de convertir nativement les UID/GID des fichiers en noms
# réels d'utilisateurs et de groupes (via /etc/passwd et /etc/group).
# ---------------------------------------------------------------------------
identities:
  enabled: false

  # Option A : Référencer un ConfigMap existant
  # (créé par ex. avec : oc create configmap diskover-identities --from-file=passwd=... --from-file=group=...)
  configMapName: ""
  # Noms des clés dans ce ConfigMap (ou du ConfigMap généré par Helm)
  passwdKey: "passwd"
  groupKey: "group"

  # Option B : Fournir le contenu inline (Helm crée automatiquement le ConfigMap)
  # Obligatoire tous les deux si enabled=true et configMapName est vide.
  passwd: ""
  # passwd: |
  #   root:x:0:0:root:/root:/bin/bash
  #   jdupont:x:10542:10000:Jean Dupont:/home/jdupont:/bin/bash
  #   smartin:x:10543:10000:Sophie Martin:/home/smartin:/bin/bash
  group: ""
  # group: |
  #   root:x:0:
  #   direction:x:10000:jdupont,smartin

  # Monter également les identités dans le pod diskover-web (false par défaut)
  mountInWeb: false

# ---------------------------------------------------------------------------
# Entrées `scans` (un CronJob par entrée)
#
# NOTE IMPORTANTE (Diskover Community Edition) :
# Dans Diskover CE, un index Elasticsearch ne peut pas être alimenté par des scans
# successifs séparés (l'option --addtoindex est réservée à l'édition commerciale).
# Pour indexer PLUSIEURS partages NFS dans un MÊME index, configurez `shares:`
# ci-dessous : tous les partages seront montés dans le même pod sous /data/<nom>
# et explorés ensemble en un seul passage dans le même index.
# ---------------------------------------------------------------------------
scans: []
# Exemple 1 : Plusieurs partages NFS indexés ensemble dans le MÊME index
# - name: global-nas
#   schedule: "0 2 * * *"
#   # indexName: "diskover-global-nas-$(date +%Y%m%d)"  # optionnel (valeur par défaut)
#   shares:
#     - name: projets          # monté sur /data/projets
#       server: nas1.corp.local
#       path: /export/projets
#       size: 10Ti
#       mountOptions: [nfsvers=4.1, ro, noatime]
#     - name: archives         # monté sur /data/archives
#       server: nas1.corp.local
#       path: /export/archives
#       size: 20Ti
#     - name: docs             # monté sur /data/docs
#       server: nas2.corp.local
#       path: /export/docs
#       size: 5Ti
#
# Exemple 2 : Un seul partage NFS
# - name: archives
#   schedule: "0 3 * * 0"
#   nfs:
#     server: nas.example.com
#     path: /export/archives
#     size: 10Ti
#     mountOptions: [nfsvers=4.1, ro, noatime]
#
# Exemple 3 : Volumes Kubernetes pré-existants (PVCs)
# - name: multi-pvc
#   schedule: "0 4 * * *"
#   volumes:
#     - name: vol-projets
#       mountPath: /data/projets
#       persistentVolumeClaim:
#         claimName: pvc-projets
#     - name: vol-archives
#       mountPath: /data/archives
#       persistentVolumeClaim:
#         claimName: pvc-archives
