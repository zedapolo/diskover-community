# =============================================================================
# Exemple de fichier de valeurs pour déploiement en environnement OFFLINE (Air-gap)
# =============================================================================

# 1. Désactiver la construction in-cluster OpenShift (BuildConfigs)
build:
  enabled: false

# 2. Secret(s) d'authentification pour le registre interne d'entreprise
# Si les credentials de votre registre interne sont déjà embarqués dans OpenShift
# (ex: pull secret global du cluster ou secrets liés aux ServiceAccounts),
# laissez cette liste vide ([]).
imagePullSecrets: []
# - name: regcred

# 3. Images pré-construites avec Podman et poussées sur votre registre interne
web:
  image:
    repository: registry.corp.local/diskover/diskover-web
    tag: "2.3.5"
    pullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    # storageClassName: ocs-storagecluster-ceph-rbd
  route:
    enabled: true
    # host: diskover.apps.mon-cluster.corp.local
    tls: true

scanner:
  image:
    repository: registry.corp.local/diskover/diskover-scanner
    tag: "2.3.5"
    pullPolicy: IfNotPresent
  supplementalGroups: [5000]       # GID autorisés sur vos exports NFS
  extraArgs: "--threads 8"

# 4. Elasticsearch ECK avec image miroir interne
elasticsearch:
  create: true
  name: diskover
  version: 8.19.0
  image: registry.corp.local/elastic/elasticsearch:8.19.0
  count: 1
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits:   { memory: 8Gi }
  storage:
    size: 200Gi
    # storageClassName: ocs-storagecluster-ceph-rbd

# 5. Définition des scans planifiés (NFS internes)
# Scanner PLUSIEURS exports NFS dans un MÊME index :
# Utilisez `shares:` ci-dessous. Les partages sont montés sous /data/<nom>
# et scannés ensemble en un seul passage dans le même index.
scans:
  - name: all-shares
    schedule: "0 2 * * *"
    shares:
      - name: projets
        server: nas.corp.local
        path: /exports/projets
        size: 10Ti
        mountOptions: [nfsvers=4.1, ro, noatime]
      - name: archives
        server: nas.corp.local
        path: /exports/archives
        size: 20Ti
        mountOptions: [nfsvers=4.1, ro, noatime]
      - name: commun
        server: nas2.corp.local
        path: /exports/commun
        size: 5Ti
        mountOptions: [nfsvers=4.1, ro, noatime]
