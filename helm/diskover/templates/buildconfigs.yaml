{{- if .Values.build.enabled }}
{{- $fn := include "diskover.fullname" . }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $fn }}-web
  labels:
    {{- include "diskover.labels" . | nindent 4 }}
spec:
  source:
    git:
      uri: {{ .Values.build.git.uri }}
      ref: {{ .Values.build.git.ref }}
    # Le Dockerfile inline remplace celui du dépôt (il n'y en a pas) ; le dépôt sert de contexte
    dockerfile: |
      FROM {{ .Values.images.nginxBase }}
      USER 0
      RUN dnf -y module enable php:8.3 \
       && dnf -y install --setopt=install_weak_deps=False \
            php-fpm php-cli php-gd php-mbstring php-xml php-pdo php-opcache \
       && (dnf -y install php-ldap php-pecl-zip || true) \
       && dnf clean all && rm -rf /var/cache/dnf \
       && php -m | grep -i -E 'sqlite3|pdo_sqlite|gd|mbstring'
      COPY diskover-web /var/www/diskover-web
      RUN chgrp -R 0 /var/www/diskover-web && chmod -R g=u /var/www/diskover-web
      USER 1001
      EXPOSE 8080
  strategy:
    type: Docker
    dockerStrategy:
      noCache: false
      {{- with .Values.build.pullSecret }}
      pullSecret:
        name: {{ . }}
      {{- end }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $fn }}-web:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $fn }}-scanner
  labels:
    {{- include "diskover.labels" . | nindent 4 }}
spec:
  source:
    git:
      uri: {{ .Values.build.git.uri }}
      ref: {{ .Values.build.git.ref }}
    dockerfile: |
      FROM {{ .Values.images.pythonBase }}
      USER 1001
      COPY --chown=1001:0 diskover /opt/diskover
      RUN pip install --no-cache-dir {{ if .Values.build.pipIndexUrl }}--index-url {{ .Values.build.pipIndexUrl }} {{ end }}{{ .Values.build.pipExtraArgs }} -r /opt/diskover/requirements.txt \
       && chmod -R g=u /opt/diskover
      ENV HOME=/tmp \
          XDG_CONFIG_HOME=/tmp/.config \
          DATABASE=/tmp/diskoverdb.sqlite3
      WORKDIR /opt/diskover
  strategy:
    type: Docker
    dockerStrategy:
      noCache: false
      {{- with .Values.build.pullSecret }}
      pullSecret:
        name: {{ . }}
      {{- end }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $fn }}-scanner:latest
  triggers:
    - type: ConfigChange
{{- end }}
